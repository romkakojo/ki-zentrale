<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Systemmonitor</title>
<style>
  :root{ --txt:#e9eaec; --dim:#a3a7ad; --mute:#71767d; --a1:#ff7a1a; --ok:#4ade80; --hot:#ff5a5a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font:12.5px/1.35 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;color:var(--txt);user-select:none;
       background:
         linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,0) 40%),
         repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 3px,transparent 3px 6px),
         repeating-linear-gradient(-45deg,rgba(0,0,0,.35) 0 3px,transparent 3px 6px),
         linear-gradient(180deg,#2a2c2f,#17181a)}
  .wrap{height:100%;display:flex;flex-direction:column;gap:7px;padding:9px 10px 10px}
  .wrap > *{flex-shrink:0}

  .top{display:flex;align-items:center;gap:8px;cursor:grab}
  .logo{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
        background:linear-gradient(145deg,#3d4045,#1d1f22);border:1px solid rgba(255,255,255,.12)}
  .top b{flex:1;font-size:12.5px;letter-spacing:.3px}
  .top b small{color:var(--mute);font-weight:400;font-size:10.5px;margin-left:4px}
  .ib{width:26px;height:24px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--dim);
      background:linear-gradient(180deg,#2e3034,#222326);border:1px solid rgba(255,255,255,.08);
      box-shadow:0 3px 0 #0d0e0f;transition:transform .07s,box-shadow .07s,background .2s,color .2s}
  .ib:active{transform:translateY(3px);box-shadow:none}
  .ib.on{color:#1a0d02;background:linear-gradient(180deg,#ff8f3a,#e8650f);border-color:transparent;box-shadow:0 3px 0 #8a3a06}
  .ib.on:active{box-shadow:none}
  .ib svg{width:13px;height:13px}

  .card{border-radius:13px;padding:7px 10px 8px;display:flex;flex-direction:column;gap:4px;
        background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
        border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 0 rgba(0,0,0,.4)}
  .row{display:flex;align-items:baseline;gap:7px}
  .lbl{font-weight:700;font-size:11px;letter-spacing:.9px;color:#c9ccd1}
  .sub{flex:1;color:var(--mute);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .val small{font-size:11px;font-weight:600;color:var(--dim);margin-left:1px}
  canvas{width:100%;height:22px;display:block}
  .bar{height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
  .bar>div{height:100%;width:0;border-radius:4px;transition:width .5s ease,background .4s;
           background:linear-gradient(90deg,#6b7078,#c9ccd1 70%,var(--a1))}
  .bar.hot>div{background:linear-gradient(90deg,#c9ccd1,var(--a1) 60%,var(--hot))}
  .mini{display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px;font-variant-numeric:tabular-nums}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--dim);font-variant-numeric:tabular-nums}
  .chip.warm{color:#ffc08a;background:rgba(255,122,26,.12)} .chip.hot{color:#ffb4b4;background:rgba(255,90,90,.14)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">
    <div class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e5e7eb" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div>
    <b>System <small id="clock"></small></b>
    <div class="ib" id="pin" title="Dauerhaft im Vordergrund"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 4H6l4-4-1-6z"/><path d="M12 14v7"/></svg></div>
    <div class="ib" id="hide" title="Ausblenden (Tray: Systemmonitor)">—</div>
  </div>

  <div class="card">
    <div class="row"><span class="lbl">CPU</span><span class="sub" id="cpuName"></span><span class="val" id="cpuVal">–</span></div>
    <canvas id="cpuC"></canvas>
  </div>

  <div class="card">
    <div class="row"><span class="lbl">RAM</span><span class="sub" id="ramSub"></span><span class="val" id="ramVal">–</span></div>
    <div class="bar" id="ramBar"><div></div></div>
    <canvas id="ramC"></canvas>
  </div>

  <div class="card">
    <div class="row"><span class="lbl">GPU</span><span class="sub" id="gpuName"></span><span class="val" id="gpuVal">–</span></div>
    <canvas id="gpuC"></canvas>
    <div class="mini"><span>VRAM</span><span id="vramTxt">–</span></div>
    <div class="bar" id="vramBar"><div></div></div>
    <div class="chips" id="gpuChips"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const host = window.chrome && window.chrome.webview;
const N = 60;                                  // 60 Sekunden Verlauf
const hist = { cpu: [], ram: [], gpu: [] };
const de = (x, d = 1) => Number(x).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });

function spark(id, data, color){
  const c = $(id), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr){ c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1;
  for (const y of [h * .5]){ g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  if (data.length < 2) return;
  const step = w / (N - 1), off = (N - data.length) * step;
  const pts = data.map((v, i) => [off + i * step, h - 1 - Math.max(0, Math.min(100, v)) / 100 * (h - 3)]);
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '55'); grad.addColorStop(1, color + '00');
  g.beginPath(); g.moveTo(pts[0][0], h); pts.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(pts[pts.length - 1][0], h);
  g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
  g.strokeStyle = color; g.lineWidth = 1.6; g.lineJoin = 'round'; g.stroke();
}
const push = (arr, v) => { arr.push(v); if (arr.length > N) arr.shift(); };
const colorFor = p => p >= 90 ? '#ff5a5a' : p >= 70 ? '#ff7a1a' : '#c9ccd1';
function setBar(id, pct){ const b = $(id); b.firstElementChild.style.width = Math.min(100, pct) + '%'; b.classList.toggle('hot', pct >= 90); }

async function tick(){
  let s;
  try { s = await (await fetch('/api/sys', { cache: 'no-store' })).json(); } catch { return; }
  $('#clock').textContent = s.time || '';
  $('#pin').classList.toggle('on', !!s.pinned);
  $('#pin').title = s.pinned ? 'Im Vordergrund angeheftet – klicken zum Lösen' : 'Dauerhaft im Vordergrund';

  if (s.cpu){
    $('#cpuVal').innerHTML = Math.round(s.cpu.pct) + '<small>%</small>';
    $('#cpuName').textContent = `${s.cpu.name} · ${s.cpu.threads} Threads`;
    push(hist.cpu, s.cpu.pct); spark('#cpuC', hist.cpu, colorFor(s.cpu.pct));
  }
  if (s.ram){
    $('#ramVal').innerHTML = de(s.ram.used) + '<small> / ' + de(s.ram.total, 0) + ' GB</small>';
    $('#ramSub').textContent = `${Math.round(s.ram.pct)} % · zugesagt ${de(s.ram.commit, 0)}/${de(s.ram.commit_total, 0)} GB`;
    setBar('#ramBar', s.ram.pct);
    push(hist.ram, s.ram.pct); spark('#ramC', hist.ram, colorFor(s.ram.pct));
  }
  if (s.gpu){
    const g = s.gpu;
    $('#gpuName').textContent = g.name || '';
    $('#gpuVal').innerHTML = (g.pct ?? '–') + '<small>%</small>';
    push(hist.gpu, g.pct || 0); spark('#gpuC', hist.gpu, colorFor(g.pct || 0));
    if (g.vram_total){ $('#vramTxt').textContent = `${de(g.vram_used)} / ${de(g.vram_total)} GB · ${Math.round(g.vram_pct)} %`; setBar('#vramBar', g.vram_pct); }
    const chips = [];
    if (g.temp != null) chips.push(`<span class="chip ${g.temp >= 80 ? 'hot' : g.temp >= 70 ? 'warm' : ''}">${g.temp} °C</span>`);
    if (g.power != null) chips.push(`<span class="chip">${g.power}${g.power_limit ? ' / ' + g.power_limit : ''} W</span>`);
    if (g.clock != null) chips.push(`<span class="chip">${g.clock} MHz</span>`);
    if (g.fan != null) chips.push(`<span class="chip">Lüfter ${g.fan} %</span>`);
    $('#gpuChips').innerHTML = chips.join('');
  } else {
    $('#gpuName').textContent = 'NVML nicht verfügbar';
  }
}

$('#pin').onclick = () => { host && host.postMessage('pin'); $('#pin').classList.toggle('on'); };
$('#hide').onclick = () => host && host.postMessage('hide');
$('#top').addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('.ib') || !host) return;
  e.preventDefault(); host.postMessage('drag');
});

tick(); setInterval(tick, 1000);
</script>
</body>
</html>
